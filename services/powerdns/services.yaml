apiVersion: v1
kind: Service
metadata:
  name: powerdns-api
  namespace: powerdns
spec:
  selector:
    app: powerdns
  ports:
  - name: api
    port: 8081
    targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: powerdns-admin
  namespace: powerdns
spec:
  selector:
    app: powerdns-admin
  ports:
  - name: http
    port: 80
    targetPort: http
