apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: powerdns-admin
  namespace: powerdns
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-to-https@kubernetescrd,traefik-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - secretName: home-papdavid-eu-wildcard-tls
    hosts:
    - dnsadmin.home.papdavid.eu
  rules:
  - host: dnsadmin.papdavid.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: powerdns-admin
            port:
              name: http
  - host: dnsadmin.home.papdavid.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: powerdns-admin
            port:
              name: http
