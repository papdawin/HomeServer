apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - database.yaml
  - ingress.yaml
  - middleware.yaml
configMapGenerator:
  - name: authentik-blueprints
    namespace: authentik
    files:
      - arrsuite-blueprint.yaml=arrsuite-blueprint.yaml
generatorOptions:
  disableNameSuffixHash: true
