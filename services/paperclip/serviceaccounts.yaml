apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperclip
  namespace: paperclip
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gavin-orsay
  namespace: paperclip
  labels:
    paperclip.homeserver/agent: gavin-orsay
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: paperclip-gavin-readonly
  labels:
    app.kubernetes.io/part-of: paperclip
    paperclip.homeserver/agent: gavin-orsay
rules:
  - apiGroups: [""]
    resources: [configmaps, endpoints, events, namespaces, nodes, persistentvolumeclaims, persistentvolumes, pods, pods/log, resourcequotas, services]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [clusterrolebindings, clusterroles, rolebindings, roles]
    verbs: [get, list, watch]
  - apiGroups: ["storage.k8s.io"]
    resources: [csidrivers, storageclasses, volumeattachments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paperclip-gavin-readonly
  labels:
    app.kubernetes.io/part-of: paperclip
    paperclip.homeserver/agent: gavin-orsay
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: paperclip-gavin-readonly
subjects:
  - kind: ServiceAccount
    name: gavin-orsay
    namespace: paperclip
