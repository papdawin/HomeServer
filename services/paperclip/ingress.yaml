apiVersion: v1
kind: Service
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app.kubernetes.io/name: paperclip
    app.kubernetes.io/part-of: paperclip
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paperclip
  ports:
    - name: http
      port: 80
      targetPort: 3100
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperclip
  namespace: paperclip
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-to-https@kubernetescrd,traefik-security-headers@kubernetescrd,arrsuite-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: home-papdavid-eu-wildcard-tls
      hosts: [paperclip.home.papdavid.eu]
  rules:
    - host: paperclip.home.papdavid.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperclip
                port:
                  name: http
