apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-provider-config
  namespace: paperclip
data:
  config.yaml: |
    model:
      provider: paperclip-codex-broker
      default: gpt-5.6-luna
    custom_providers:
      - name: paperclip-codex-broker
        base_url: http://paperclip-codex-broker.paperclip.svc.cluster.local:8645/v1
        key_env: OPENAI_API_KEY
        api_mode: codex_responses
