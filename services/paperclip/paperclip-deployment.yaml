apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    app.kubernetes.io/name: paperclip
    app.kubernetes.io/part-of: paperclip
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperclip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperclip
        app.kubernetes.io/part-of: paperclip
    spec:
      serviceAccountName: paperclip
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: talos-cp-1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperclip
          image: ghcr.io/paperclipai/paperclip@sha256:40f46940c4612ead131aebe6079cd4651f8cd1434af49f7c621887f4a452a62e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3100"
            - name: SERVE_UI
              value: "true"
            - name: PAPERCLIP_HOME
              value: /paperclip
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: authenticated
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: private
            - name: PAPERCLIP_PUBLIC_URL
              value: https://paperclip.home.papdavid.eu
            - name: PAPERCLIP_ALLOWED_HOSTNAMES
              value: paperclip.paperclip.svc.cluster.local
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/paperclip-ca/ca.crt
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperclip-runtime
                  key: better-auth-secret
            - name: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperclip-runtime
                  key: tool-action-signing-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: state
              mountPath: /paperclip
            - name: hermes-ca
              mountPath: /etc/paperclip-ca
              readOnly: true
            - name: hermes-adapter-overlay
              mountPath: /app/packages/adapters/hermes/src/gateway/index.ts
              subPath: gateway-index.ts
              readOnly: true
            - name: hermes-adapter-overlay
              mountPath: /app/packages/adapters/hermes/src/gateway/server/skills.ts
              subPath: gateway-skills.ts
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: paperclip-state-iscsi
        - name: hermes-ca
          secret:
            secretName: paperclip-hermes-ca
            items:
              - key: tls.crt
                path: ca.crt
        - name: hermes-adapter-overlay
          configMap:
            name: paperclip-hermes-gateway-skill-inventory
