apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-frank
  namespace: paperclip
  labels:
    app.kubernetes.io/name: hermes-frank
    app.kubernetes.io/part-of: hermes-agent
    paperclip.homeserver/agent: frank-underwoord
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-frank
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-frank
        app.kubernetes.io/part-of: hermes-agent
        paperclip.homeserver/agent: frank-underwoord
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: talos-cp-1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: nousresearch/hermes-agent@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
          imagePullPolicy: IfNotPresent
          command: [hermes, gateway, run]
          ports:
            - name: api
              containerPort: 8642
          env:
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-gateway-keys
                  key: frank-underwoord
            - name: HERMES_HOME
              value: /opt/data
            - name: PAPERCLIP_API_URL
              value: http://paperclip.paperclip.svc.cluster.local
            - name: AGENT_ROLE
              value: frank-underwoord
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: state
              mountPath: /opt/data
              subPath: agents/frank-underwoord
            - name: role
              mountPath: /etc/hermes/role.md
              subPath: frank-underwoord.md
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: paperclip-state-iscsi
        - name: role
          configMap:
            name: agent-roles
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-frank
  namespace: paperclip
  labels:
    app.kubernetes.io/name: hermes-frank
    app.kubernetes.io/part-of: hermes-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes-frank
  ports:
    - name: api
      port: 8642
      targetPort: api
