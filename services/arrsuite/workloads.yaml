apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: arrsuite
  labels: {app.kubernetes.io/name: qbittorrent, app.kubernetes.io/part-of: arrsuite}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: qbittorrent}}
  template:
    metadata: {labels: {app.kubernetes.io/name: qbittorrent, app.kubernetes.io/part-of: arrsuite}}
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-cp-1
      automountServiceAccountToken: false
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
        - {key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule}
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent@sha256:97333cc1ccf903e0bbcd8eb67e3332e4970e9c1ecabe145e499e9c0847ebcaed
          imagePullPolicy: IfNotPresent
          env: [{name: PUID, value: "1000"}, {name: PGID, value: "1000"}, {name: TZ, value: Europe/Amsterdam}, {name: WEBUI_PORT, value: "8080"}, {name: TORRENTING_PORT, value: "6881"}]
          ports: [{name: http, containerPort: 8080}, {name: torrent-tcp, containerPort: 6881}, {name: torrent-udp, containerPort: 6881, protocol: UDP}]
          volumeMounts:
            - {name: appdata, mountPath: /config, subPath: qbittorrent}
            - {name: media, mountPath: /media}
          readinessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 60, periodSeconds: 20}
          securityContext: {runAsUser: 0, runAsGroup: 0, runAsNonRoot: false, allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]}}
      volumes:
        - {name: appdata, persistentVolumeClaim: {claimName: arrsuite-state}}
        - {name: media, persistentVolumeClaim: {claimName: media}}
---
