apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: arrsuite
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: arrsuite
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-to-https@kubernetescrd,traefik-security-headers@kubernetescrd,arrsuite-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: home-papdavid-eu-wildcard-tls
      hosts:
        - jellyfin.home.papdavid.eu
  
  
  rules:
    - host: jellyfin.home.papdavid.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  name: http
  
