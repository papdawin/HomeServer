apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: arrsuite
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: arrsuite
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-lan
  namespace: arrsuite
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: arrsuite
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
      nodePort: 30096
      protocol: TCP
