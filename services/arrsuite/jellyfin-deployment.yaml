apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: arrsuite
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: arrsuite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/part-of: arrsuite
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-cp-1
      serviceAccountName: arrsuite-jellyfin
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: HOME
              value: /config
            - name: JELLYFIN_PublishedServerUrl
              value: http://jellyfin.home.papdavid.eu
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 2
              memory: 4Gi
            limits:
              gpu.intel.com/i915: 1
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: jellyfin
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: arrsuite-state
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: media
          persistentVolumeClaim:
            claimName: media
