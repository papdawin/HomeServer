apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  - name: homepage-config
    namespace: homepage
    files:
      - settings.yaml
      - services.yaml
      - widgets.yaml
      - bookmarks.yaml
generatorOptions:
  disableNameSuffixHash: true
