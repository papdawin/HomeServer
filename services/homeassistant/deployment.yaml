apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: homeassistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homeassistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeassistant
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-cp-1
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: seed-config
          image: busybox:1.36.1
          command: [sh, -ec]
          args:
            - |
              if [ ! -e /config/configuration.yaml ]; then
                printf '%s\n' \
                  'default_config:' \
                  '' \
                  'http:' \
                  '  use_x_forwarded_for: true' \
                  '  trusted_proxies:' \
                  '    - 10.244.0.0/16' \
                  > /config/configuration.yaml
              fi
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: homeassistant
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: homeassistant
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-state
