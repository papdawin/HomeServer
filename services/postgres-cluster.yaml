apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  instances: 1
  imageName: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
  postgresUID: 999
  postgresGID: 999
  affinity:
    nodeSelector:
      kubernetes.io/hostname: talos-cp-2
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: postgres-credentials
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS cube;
        - CREATE EXTENSION IF NOT EXISTS earthdistance;
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - ALTER ROLE immich WITH SUPERUSER;
  storage:
    size: 50Gi
    storageClass: nas-nfs
  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: authentik-postgres-credentials
      - name: paperclip
        ensure: present
        login: true
        superuser: false
        createdb: true
        passwordSecret:
          name: paperclip-postgres-credentials
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  postgresql:
    shared_preload_libraries:
      - vchord.so
